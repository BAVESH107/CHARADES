<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>🎭 Charades — Free Edition</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <div class="app">

    <!-- SCREEN 1: HOME -->
    <div id="home" class="screen active">
      <h1>🎭 CHARADES</h1>
      <p class="tagline">Tilt to play.</p>

      <label>Category</label>
      <select id="category">
        <!-- Decks will be injected here by JavaScript -->
      </select>

      <label>Time (seconds)</label>
      <select id="timeLimit">
        <option value="30">30s</option>
        <option value="60" selected>60s</option>
        <option value="90">90s</option>
      </select>

      <button id="startBtn" class="primary">▶ START GAME</button>
      
      <!-- NEW: Create Deck Button -->
      <button id="createDeckBtn" class="secondary"> CREATE CUSTOM DECK</button>
      <button id="syncBtn" class="secondary" style="border-color: #ff9800; color: #ff9800;">SYNC OLD DECKS</button>
      
      <button id="permissionBtn" class="permission">📱 ENABLE TILT</button>
      <p id="permissionStatus" class="status"></p>
    </div>

    <!-- SCREEN 1.5: CREATE CUSTOM DECK -->
    <div id="createDeck" class="screen">
      <h2>Create Your Deck</h2>
      
      <label>Deck Name (e.g., Inside Jokes)</label>
      <input type="text" id="customDeckName" placeholder="Enter deck name..." />

      <label>Words (separated by commas)</label>
      <textarea id="customDeckWords" placeholder="Word 1, Word 2, Word 3..."></textarea>

      <button id="saveDeckBtn" class="primary">💾 SAVE DECK</button>
      <button id="backToHomeBtn" class="secondary">⬅️ BACK</button>
    </div>

    <!-- SCREEN 2: COUNTDOWN -->
    <div id="countdown" class="screen">
      <h2>Get Ready...</h2>
      <div id="countdownNum" class="big-num">3</div>
      <p>Hold phone on forehead.<br><strong>TILT UP = GUESSED ✅</strong><br><strong>TILT DOWN = PASS ❌</strong></p>
    </div>

    <!-- SCREEN 3: GAME -->
    <div id="game" class="screen">
      <div class="hud">
        <span id="timer">60</span>
        <span id="scoreDisplay">Score: 0</span>
      </div>
      
      <div id="wordCard" class="word-card">
        <p id="currentWord">Loading...</p>
      </div>
      
      <div class="tilt-hint">
        ⬆️ Tilt UP = Guessed &nbsp; | &nbsp; ⬇️ Tilt DOWN = Pass
      </div>
    </div>

    <!-- SCREEN 4: RESULT -->
    <div id="result" class="screen">
      <h2>🎉 Time's Up!</h2>
      <div class="score-display">
        <p>You scored</p>
        <h1 id="finalScore">0</h1>
        <p>points</p>
      </div>
      <h3>Words Played:</h3>
      <ul id="wordHistory"></ul>
      <button id="restartBtn" class="primary">🔄 PLAY AGAIN</button>
    </div>

  </div>

  <script src="script.js?v=5"></script>
</body>
</html>
