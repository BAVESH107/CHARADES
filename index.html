<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>🎭 Charades</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link rel="stylesheet" href="styles.css?v=18" />
</head>
<body>
  <div class="app">

    <!-- SCREEN 1: HOME -->
    <div id="home" class="screen active">
      <header class="top-header">
        <h1>CHARADES</h1>
      </header>

      <div class="section-title">
        <label>Pick a deck</label>
      </div>

      <div id="deckGrid" class="deck-grid">
        <div class="empty-state">Loading decks...</div>
      </div>

      <div class="section-title" style="margin-top: 24px;">
        <label>Round length</label>
      </div>

      <div class="segmented-control" id="timeLimitGroup">
        <button class="segment" data-value="120">2 min</button>
        <button class="segment active" data-value="300">5 min</button>
        <button class="segment" data-value="360">6 min</button>
      </div>
      <input type="hidden" id="timeLimit" value="300" />

      <div class="action-area">
        <button id="startBtn" class="primary-btn">
          START GAME
        </button>
        <button id="createDeckBtn" class="text-btn" style="margin-top: 16px;">
          + Create a deck
        </button>
      </div>
    </div>

    <!-- SCREEN 2: CREATE CUSTOM DECK -->
    <div id="createDeck" class="screen">
      <header class="top-header">
        <button id="backToHomeBtn" class="text-btn"><i class="ph ph-arrow-left"></i> Back</button>
      </header>

      <div class="form-group" style="margin-top: 16px;">
        <label>Deck name</label>
        <input type="text" id="customDeckName" placeholder="e.g., College Chaos" />
      </div>

      <div class="form-group">
        <label>Add cards</label>
        <div class="tag-input-container" id="tagContainer">
          <input type="text" id="tagInput" placeholder="Type a card and press Enter..." />
        </div>
        <p class="helper-text" id="wordCount">0 cards added</p>
      </div>

      <button id="saveDeckBtn" class="primary-btn" style="margin-top: 24px;">Save deck</button>
    </div>

    <!-- SCREEN 3: COUNTDOWN -->
    <div id="countdown" class="screen">
      <div id="countdownNum" class="big-num">3</div>
      <p class="instruction-text">Hold phone on forehead.<br><br><strong style="color:var(--coral)">Tilt UP = Pass</strong><br><strong style="color:var(--mint)">Tilt DOWN = Guess</strong></p>
    </div>

    <!-- SCREEN 4: GAME -->
    <div id="game" class="screen">
      <div class="hud">
        <span id="timer" class="timer">300</span>
        <span id="scoreDisplay" class="score">0 pts</span>
      </div>
      
      <div id="wordCard" class="word-card">
        <p id="currentWord">Loading...</p>
      </div>
    </div>

    <!-- SCREEN 5: RESULT -->
    <div id="result" class="screen">
      <div class="top-header">
        <h2>Time's Up!</h2>
      </div>
      
      <div class="score-display">
        <h1 id="finalScore">0</h1>
        <p>points scored</p>
      </div>
      
      <div class="history-container">
        <h3>Cards Played</h3>
        <ul id="wordHistory"></ul>
      </div>
      
      <button id="restartBtn" class="primary-btn">Play Again</button>
    </div>

    <!-- Global Status (Tilt) -->
    <div class="global-status">
      <button id="permissionBtn" class="status-pill" style="display:none;">
        <i class="ph ph-device-mobile"></i> Enable tilt controls
      </button>
      <div id="permissionActive" class="status-active" style="display:none;">
        <span class="dot"></span> Tilt controls active
      </div>
    </div>

  </div>

  <script src="app.js?v=18"></script>
</body>
</html>
